[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inverse-problems"
version = "0.1.0"
description = "Two- and three-dimensional geodesic ray transform tools"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # Older PROPACK wheels fail macOS's stricter native-library validation.
    "scipy>=1.17.1; sys_platform == 'darwin' and python_version >= '3.11'",
    "scipy>=1.11; sys_platform != 'darwin' or python_version < '3.11'",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
learning = ["torch>=2.0"]
notebook = ["jupyter>=1.0", "nbformat>=5.9"]
test = ["pytest>=7.4", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["common*", "grt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["grt"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = ["@abstractmethod"]
